# Council defaults. Override per user in ~/.config/council/council.toml
# and per project in <repo>/.council.toml (same keys; later files win per key).

[defaults]
distinct_providers = true   # no two seats in one phase from the same provider
skip_trivial = true         # typo/one-liner: skip research and grill (review still runs)

# Model per provider. Omit a provider to use its CLI's configured default.
[seats.claude]
model = "claude-opus-5-5"

[seats.gemini]
model = "best"              # strongest Gemini in `agy models`

[research]
models = 2
prefer = ["claude", "gemini", "codex", "grok"]

[grill]
models = 1
prefer = ["grok", "codex", "claude", "gemini"]

[implement]
models = 1                  # >1 = parallel attempts in separate worktrees, best one wins
prefer = ["claude", "codex"]

[review]
models = 2
prefer = ["codex", "grok", "gemini", "claude"]
exclude_implementer = true  # the implementer's provider does not count toward `models`
max_rounds = 3
# Green = every gate below passes.
gate = ["evals", "findings"]  # any of: "evals", "findings", "score"
evals = []                  # commands run every round, e.g. ["pnpm typecheck", "pnpm test --changed"]
final_evals = []            # extra commands run once, in the round that turns green
block_on = ["blocker", "major"]  # confirmed findings at these severities block green
min_score = 9               # only gates when "score" is in `gate`
show_score = true           # seats still give N/10; shown, not gating unless "score" in `gate`
